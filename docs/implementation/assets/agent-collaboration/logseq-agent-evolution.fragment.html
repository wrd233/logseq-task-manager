</style>
<script>
(()=>{
  const root=document.getElementById('ls-agent-evolution');
  const q=s=>root.querySelector(s);
  const qa=s=>Array.from(root.querySelectorAll(s));
  const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const node=(id,text,role='plain',children=[])=>({id,text,role,children});
  const clone=x=>JSON.parse(JSON.stringify(x));
  const flatten=xs=>xs.flatMap(x=>[x,...flatten(x.children)]);
  const find=(xs,id)=>flatten(xs).find(x=>x.id===id);
  const base=[
    node('B01','[目标] 选出一个交通方便、节奏轻松的目的地，留出自由散步的时间。','goal',[node('B02','费用上限是每人 800 元；如果天气不好，可以改为室内活动。')]),
    node('B03','**[想法]** 先比较两处目的地，不急着把所有景点排满。','idea',[node('B04','可能湖边更合适，但现在还不确定。'),node('B05','[注] 同行的人容易疲劳，连续步行最好控制在半小时以内。','note')]),
    node('B06','TODO [事务] 核对住宿与返程安排','task',[node('B07','[问题] “可取消”是不是等于全额退款？','question')]),
    node('B08','[记录] 这次先做比较，目的地还没有决定。','record')
  ];
  const discussionBase=[
    node('D01','[目标] 这次出门想轻松一点，不想把周末变成赶任务。','goal'),
    node('D02','[想法] 我有点想去湖边，不过也可能只是最近太想换个环境。','idea',[node('D03','还没想清楚是想出去走走，还是想找一个安静的地方待着。')]),
    node('D04','预算先按每人 800 元考虑，还没问同行的人。','note')
  ];
  const scratchBase=[
    node('S01','周末？湖边可能不错，但天气还没看。'),
    node('S02','别太满。想留一段空白时间。'),
    node('S03','800 / 人？还得问一下。'),
    node('S04','可取消不一定全退，这个要真的查一下。'),
    node('S05','想留一段空白时间。'),
    node('S06','同行的人容易累，别连续走太久。')
  ];
  const compareFile={id:'F01',name:'目的地比较.md',size:'完整比较 · Agent 撰写 · 演示材料',kind:'comparison'};
  const conditionFile={id:'F02',name:'住宿与返程核对.md',size:'完成依据 · 条款与车次 · 演示材料',kind:'evidence'};
  const planFile={id:'F03',name:'轻松出游的候选方向.md',size:'讨论材料 · 两个方向仍保留 · 演示材料',kind:'options'};
  const scenes={
    execute:{name:'边做边记录',foot:'一个事务承接目标、过程和结果；搜索操作不会逐条变成笔记。',steps:[
      {label:'已有记录',title:'先有一个值得推进的工作',rev:1,user:'先把这个周末旅行放在这里。比较一下，但别急着决定目的地。',agent:'我会围绕“核对住宿与返程”推进，保留你对轻松节奏和天气的条件。',reading:'完整原文的当前读法；选择不同编排不会改左边。',notes:'原文 v1，8 个块；任务仍是 TODO。',files:'还没有新增材料。',principle:'内聚性：记录围绕同一个问题长出来，不按对话次数堆积。'},
      {label:'带走现场',title:'从现在的工作跳到 Agent 能理解的现场',rev:1,user:'请比较两处的交通、住宿和取消条件；材料写在这个工作目录里。',agent:'我得到原文、任务范围、相关文件和写作约定。需要查的事实、还没决定的偏好分开处理。',reading:'可以给出新的阅读编排；原句和所属条件继续保留。',notes:'仍是 v1；带走现场没有自动写回笔记。',files:'明确产物目录：本工作的材料目录。',principle:'现场包含“我现在要做什么”，以及“哪些仍然不确定”。'},
      {label:'产生材料',title:'Agent 先做事，结果成为可阅读的材料',rev:1,user:'把比较写成一份材料，我想直接看两处的差别。',agent:'已写出目的地比较。取消条款尚未核实，因此没有把事务标成完成。',reading:'点“材料”可以打开完整比较；正文仍可换编排。',notes:'原文仍是 v1；没有因为生成文件就新增一串 TODO。',files:'新增并关联“目的地比较.md”。',principle:'文件承载详细产物；笔记只需承接值得留下的进展。',filesList:[compareFile],suggestedTab:'material'},
      {label:'回记进展',title:'顺带记录一次有意义的阶段变化',rev:2,user:'交通比较做完就记一下；不必把每次搜索都留下来。',agent:'我把进展接在原来的事务下，交通核对可以 DONE；住宿条款仍待核对。',reading:'同一事务下能读到已完成部分、材料和未解决问题。',notes:'原文 v1 → v2；原事务下增加一个 DONE 和一条阶段记录。',files:'“目的地比较.md”继续作为详细依据。',principle:'“一个子步骤完成”与“整个事务完成”是两个不同事实。',filesList:[compareFile]},
      {label:'继续交流',title:'你的新想法接回原来的思考，而非另起一份总结',rev:3,user:'我还是比较喜欢湖边，不过下雨就改室内；而且不想起太早。',agent:'我保留“比较喜欢”和“不过”，把新的条件接回这条想法。不会替你写成“已决定去湖边”。',reading:'偏好、条件和待办可以靠近阅读，原有句子继续完整出现。',notes:'v2 → v3；补充到现有“想法”下面，未把偏好升级成决策。',files:'比较材料不因偏好变化而丢失另一处选项。',principle:'保留你的语气，也保留想法如何改变的过程。',filesList:[compareFile]},
      {label:'有据完成',title:'完成一个事务，同时保留尚未决定的项目',rev:4,user:'条款和返程也核对清楚后，把这个事务完成；天气留到出发前再看。',agent:'核对事务已有完整依据，变为 DONE。新增出发前查天气的 TODO；项目和目的地仍未被自动宣布完成。',reading:'“已有进展 / 条件与权衡 / 后续行动”能读出当前状态。',notes:'v3 → v4；仅完成“核对住宿与返程”，天气任务仍是 TODO。',files:'新增“住宿与返程核对.md”，保留实际完成依据。',principle:'任务状态跟着完成条件走；项目完成不能由子任务数量推断。',filesList:[compareFile,conditionFile]}
    ]},
    discuss:{name:'讨论后沉淀',foot:'讨论可以很长；笔记只留下以后还需要继续使用的想法、条件和问题。',steps:[
      {label:'模糊起点',title:'尚未成形的想法也有一个稳定的落点',rev:1,user:'我现在还说不太清楚，只觉得周末想出去一下。',agent:'先把你的原话当作起点。“想换环境”和“想轻松一点”可能是两件事，暂时不合成结论。',reading:'把目标和思考分开读，不给想法贴“已定方案”的标题。',notes:'原文 v1；“有点”“可能”“还没想清楚”全部保留。',files:'还不需要额外材料。',principle:'清楚的呈现可以容纳模糊的想法。'},
      {label:'先聊清楚',title:'先展开对话，暂时不把每一句都写进笔记',rev:1,user:'可能更想安静待着。但如果一直在室内，我又怕觉得没出来过。',agent:'那我们保留两个方向：轻松散步，或找安静的地方。现在是讨论，笔记尚未被写回。',reading:'仍读取原文；对话中的新推断没有混进原文。',notes:'仍是 v1；这轮交流没有新增块。',files:'没有新增文件。',principle:'一段对话不必对应一条永久记录。'},
      {label:'挑选落点',title:'Agent 提出少量沉淀候选，意义不清楚处继续交流',rev:1,user:'可以留一点，但别整理得像一个已经确定的计划。',agent:'建议把“散步”和“安静待着”的权衡放在现有想法下，把预算是否合适保留为问题。',reading:'候选有明确的落点，当前正文仍展示已保存原文。',notes:'候选尚未写回；正文还是 v1。',files:'暂不生成一份重复正文的“总结文件”。',principle:'先判断什么值得留下，再决定怎样写。',pending:'建议追加到“想法”下：可能更想安静待着，但又担心一直在室内会觉得没出来过。预算是否合适，仍需问同行的人。'},
      {label:'少量沉淀',title:'把有后续价值的想法留在同一个主题中',rev:2,user:'这样放可以。保留我前面的原话，新想到的往下补。',agent:'已在现有想法下补充权衡，并新增一个预算问题。没有整篇重写，也没有复制整段聊天。',reading:'思考及其补充一起读；问题独立可见。',notes:'v1 → v2；新增两条有效记录，原来的思考过程继续在场。',files:'没有为了每轮交流新增材料。',principle:'同一问题持续发展，比每轮生成一份总结更容易接着想。'},
      {label:'继续发展',title:'新材料帮助讨论；新的偏好仍然保留余地',rev:3,user:'把两个方向的差别写成一份短材料吧。我目前偏向散步，但还要问一下。',agent:'材料保留两个方向；“目前偏向”作为一条补充，不把它写成共同决定。',reading:'正文读思考过程，材料看详细比较。',notes:'v2 → v3；原主题下继续补充偏好及待确认条件。',files:'新增“轻松出游的候选方向.md”。',principle:'详细材料和思考笔记各有用途，通过关联保持同一现场。',filesList:[planFile]},
      {label:'带着问题',title:'讨论暂告一段落，尚未决定的内容仍然可见',rev:4,user:'先聊到这里。问同行的人是不是也想散步，这个可以记成待办。',agent:'只把明确要做的询问记为 TODO。你对方向的倾向仍是想法，“预算是否合适”仍是问题。',reading:'目标、思考、问题和行动在同一主题里。',notes:'v3 → v4；增加询问同行人的 TODO，没有给每个问题都自动建任务。',files:'候选材料继续关联在这个项目下。',principle:'想法、问题、行动和决策具有不同含义，不必全部变成 TODO。',filesList:[planFile]}
    ]},
    scratch:{name:'零散记录再发展',foot:'按你的原有习惯随手记；Agent 的整理深度由你这次想做的事决定。',steps:[
      {label:'先随手记',title:'零散原文是思考的入口，不需要先写得工整',rev:1,user:'我先零散记这些，暂时没有想好结构。',agent:'我先保留这些句子。两次出现的“空白时间”都在，不能只因为重复就删掉。',reading:'未指定整理含义时，保留原顺序和全部原句。',notes:'原文 v1，6 个块；没有添加标签或改任务状态。',files:'还没有材料。',principle:'输入可以零散，保存和来源必须可靠。'},
      {label:'换个读法',title:'先让它好读：只改变阅读层',rev:1,user:'先排得好读一点，我的原文别动。',agent:'我用“方向 / 节奏与条件 / 待确认事项”来编排。正文直接取原块，保留“可能”“？”和两次重复。',reading:'右边已经按关系聚合；切回原结构可检查每一句。',notes:'仍是 v1；原文内容、顺序、任务状态全部没变。',files:'只产生阅读方案，没有新写材料。',principle:'编排可变，原文不变；条件必须跟着它所限定的想法。'},
      {label:'整理建议',title:'你希望真正整理笔记时，先看含义与落点',rev:1,user:'接下来按我常用的想法、注意点、任务整理。可取消这件事确实要去查。',agent:'建议保留原话，用行首标记和父子关系整理；只有你明确要查的取消条款转成 TODO。',reading:'显示候选说明，原文正文仍是 v1。',notes:'还未写回；格式调整和新增任务都能提前看清。',files:'不额外创建一份“整理后原文”文件。',principle:'好读、格式整理和语义决定是三件可以分别处理的事。',pending:'保留原句；给想法与条件加已有标记；把同行人的疲劳条件放到节奏下；“可取消”这句成为 TODO；“800 / 人？”继续保持待确认。'},
      {label:'写回结构',title:'真正改了笔记：标记、层级和一个明确任务',rev:2,user:'可以这样整理。那两次空白时间先保留，我确实是在不同时候想到的。',agent:'已调整标记与层级，明确的查条款任务新增 TODO。两条相同记录保留为两个不同来源。',reading:'右边使用新的原文 v2；同一段可用不同编排阅读。',notes:'v1 → v2；实际写回了标记与父子关系，仍保留原话。',files:'没有文件变更。',principle:'真正写回的变化要可回看；来源身份不能由重复句子合并掉。'},
      {label:'保留声音',title:'共同写作通过补充推进，保留你的表达',rev:3,user:'我其实不是想把整个行程规划完，只是想先降低临时做决定的压力。',agent:'这句话放到当前想法下。它解释了为什么留空白时间，我不会把它改写成“高效旅行方案”。',reading:'想法、原因与限制一起呈现，语气和不确定性还在。',notes:'v2 → v3；补充一个原因，原来的零散句子全部保留。',files:'仍不需要新文件。',principle:'Agent 的建议帮助你把意思展开，不替换成另一种声音。'},
      {label:'再次迭代',title:'记录可以再变零散，Agent 继续接回已有主题',rev:4,user:'补一条：如果同行的人这周很累，那就别安排必须打卡的地方。',agent:'新条件接到“同行的人容易累”下面；它没有被误写成取消整个旅行，也没有另起一份重复总结。',reading:'局部关系更新，已有思考、重复句和 TODO 都仍可读。',notes:'v3 → v4；在现有注意点下新增条件，任务还是 TODO。',files:'没有文件变更。',principle:'记录 → 编排 → 交流 → 写回 → 再记录，可以反复循环。'}
    ]}
  };
  function snapshot(scene,step){
    let blocks=clone(scene==='execute'?base:scene==='discuss'?discussionBase:scratchBase);
    if(scene==='execute'){
      if(step>=3){const t=find(blocks,'B06');t.children.push(node('B09','DONE 核对两处目的地的交通安排','task'),node('B10','[记录] 两处交通已比较，住宿取消条款仍需核对。详情见材料“目的地比较.md”。','record'));}
      if(step>=4)find(blocks,'B03').children.push(node('B11','[想法] 我还是比较喜欢湖边，不过下雨就改室内；而且不想起太早。','idea'));
      if(step>=5){find(blocks,'B06').text='DONE [事务] 核对住宿与返程安排';find(blocks,'B06').children.push(node('B12','[记录] 已核对条款：演示住宿可在约定期限前全退；两处均有傍晚返程。详见材料“住宿与返程核对.md”。','record'));blocks.push(node('B13','TODO 出发前再看天气预报','task',[node('B14','[注] 目的地还没最终决定；下雨就以室内活动为主。','note')]));}
    }else if(scene==='discuss'){
      if(step>=3){find(blocks,'D02').children.push(node('D05','[想法] 可能更想安静待着，但又担心一直在室内会觉得没出来过。','idea'));blocks.push(node('D06','[问题] 每人 800 元的预算，同行的人觉得合适吗？','question'));}
      if(step>=4){find(blocks,'D02').children.push(node('D07','[想法] 我目前偏向散步，但还要问一下同行的人。','idea'));blocks.push(node('D08','[记录] 两个候选方向的差别见材料“轻松出游的候选方向.md”。','record'));}
      if(step>=5)blocks.push(node('D09','TODO 问同行的人是不是也想轻松散步','task',[node('D10','[注] 询问之后再一起决定方向。','note')]));
    }else if(step>=3){
      blocks=[node('S01','[想法] 周末？湖边可能不错，但天气还没看。','idea',[node('S03','[注] 800 / 人？还得问一下。','note')]),node('S02','[想法] 别太满。想留一段空白时间。','idea',[node('S06','[注] 同行的人容易累，别连续走太久。','note')]),node('S04','TODO 可取消不一定全退，这个要真的查一下。','task'),node('S05','[记录] 想留一段空白时间。','record')];
      if(step>=4)find(blocks,'S02').children.push(node('S07','[想法] 我其实不是想把整个行程规划完，只是想先降低临时做决定的压力。','idea'));
      if(step>=5)find(blocks,'S06').children.push(node('S08','[注] 如果同行的人这周很累，那就别安排必须打卡的地方。','note'));
    }
    return {blocks,files:clone(scenes[scene].steps[step].filesList||[])};
  }

    const target=Math.max(0,Math.min(5,step));
    if(target>state.step&&!state.fresh){state.inspector='context';state.contextTab='boundary';renderInspector();status('现场已改变：先重新读取，保留你刚补充的句子，再继续。');save();return;}
    state.step=target;state.selected=null;state.selectedFile=null;state.history=null;state.tab=scenes[state.scene].steps[target].suggestedTab||'body';render();status('当前：'+scenes[state.scene].steps[target].label+'。浅绿标出这一步的笔记变化。');save();
  }
  root.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b||!root.contains(b)||b.disabled)return;
    if(b.dataset.scene){state.scene=b.dataset.scene;state.step=0;state.tab='body';state.inspector='step';state.manual=false;state.fresh=true;state.selected=null;state.selectedFile=null;state.history=null;render();status('切到“'+scenes[state.scene].name+'”；共享约定继续保留。');save();return;}
    if(b.dataset.step!==undefined){move(Number(b.dataset.step));return;}
    if(b.id==='ae-next'||b.id==='ae-prev'){move(state.step+(b.id==='ae-next'?1:-1));return;}
    if(b.id==='ae-tab-body'||b.id==='ae-tab-material'||b.id==='ae-tab-history'){state.tab=b.id==='ae-tab-body'?'body':b.id==='ae-tab-material'?'material':'history';state.history=null;state.selectedFile=null;renderWorkbench(current(),newIds());save();return;}
    if(b.id==='ae-native-focus'||b.id==='ae-native-read'){state.tab='body';state.selected=flatten(current().blocks)[0].id;render();status(b.id==='ae-native-focus'?'已在演示左侧定位原文。真实写作仍发生在 Logseq。':'阅读当前工作；右边的编排不会改变左边原文。');save();return;}
    if(b.dataset.source){state.selected=b.dataset.source;qa('[data-native-id],[data-read-id]').forEach(el=>el.classList.toggle('ae-selected',el.dataset.nativeId===state.selected||el.dataset.readId===state.selected));const n=find(current().blocks,state.selected);status('来源 '+state.selected+' · 当前原文 v'+revision()+' · '+(n?n.text:'历史来源'));save();return;}
    if(b.dataset.file){state.selectedFile=b.dataset.file;renderWorkbench(current(),newIds());if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});save();return;}
    if(b.hasAttribute('data-file-back')){state.selectedFile=null;renderWorkbench(current(),newIds());if(window.lucide)window.lucide.createIcons({attrs:{width:16,height:16}});save();return;}
    if(b.dataset.history!==undefined){state.history=Number(b.dataset.history);renderWorkbench(current(),newIds());return;}
    if(b.hasAttribute('data-history-back')){state.history=null;renderWorkbench(current(),newIds());return;}
    if(b.dataset.inspector){state.inspector=b.dataset.inspector;renderInspector();save();return;}
    if(b.dataset.context){state.contextTab=b.dataset.context;renderInspector();save();return;}
    if(b.dataset.option){q('.ae-options').open=false;if(b.dataset.option==='structure'){state.layout='structure';state.tab='body';renderWorkbench(current(),newIds());status('已切回原结构；原文版本不变。');}else {state.inspector=b.dataset.option==='rules'?'rules':'context';renderInspector();}save();return;}
    if(b.hasAttribute('data-add-user')){state.manual=true;state.fresh=false;render();status('左边增加了你的一句补充；Agent 旧现场过时，等待重新读取。');save();return;}
    if(b.hasAttribute('data-reread')){state.fresh=true;renderInspector();root.dataset.fresh='true';status('已重新读取当前原文；刚补充的句子继续保留，可以推进。');save();return;}
    if(b.dataset.workspace){state.workspace=b.dataset.workspace;renderInspector();save();return;}
    if(b.hasAttribute('data-save-rules')){const value=q('#ae-shared-rules').value.trim();if(!value){status('共同约定不能为空。');return;}if(value!==state.shared){state.shared=value;state.sharedRev++;}renderInspector();status('共同约定已更新。不同工作区要重新读取后采用新版。');save();return;}
    if(b.hasAttribute('data-load-rules')){state.loaded[state.workspace]=state.sharedRev;state.loadedRules[state.workspace]=state.shared;renderInspector();status('此工作区已重新读取共享 v'+state.sharedRev+'；项目自己的补充继续保留。');save();return;}
  });
  q('#ae-layout').addEventListener('change',e=>{state.layout=e.target.value;state.selected=null;renderWorkbench(current(),newIds());status('读法变为“'+e.target.selectedOptions[0].textContent+'”；左侧原文 v'+revision()+' 完全不变。');save();});
  root.addEventListener('keydown',e=>{if(e.key==='Escape'&&q('.ae-options').open){q('.ae-options').open=false;q('.ae-options summary').focus();}});
  root.addEventListener('click',e=>{if(!e.target.closest('.ae-options'))q('.ae-options').open=false;});
  window.addEventListener('openai:set_globals',e=>{if(e.detail&&e.detail.globals&&e.detail.globals.widgetState){restore(e.detail.globals.widgetState);render();}});
  render();
})();
</script>
