<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>工作台 · 需求与实现地图</title>
<style>
:root{color-scheme:light dark;--bg:#f4f6f4;--surface:#fff;--ink:#25382f;--muted:#65756b;--line:#dae2db;--accent:#276447;--good:#e5f1e8;--partial:#e8edf8;--plan:#f5eedf;--excluded:#eceeed;--focus:#397c5b;font:14px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft Yahei",sans-serif}
@media(prefers-color-scheme:dark){:root{--bg:#17221d;--surface:#1e2b24;--ink:#e0e9e2;--muted:#a3b4a8;--line:#3b4c41;--accent:#96d3ae;--good:#284536;--partial:#303d59;--plan:#49432e;--excluded:#354039;--focus:#8ed1a7}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}button,input,select{font:inherit;color:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--focus);outline-offset:2px}header{padding:28px 32px 18px;border-bottom:1px solid var(--line);background:var(--surface)}.eyebrow{font-size:11px;letter-spacing:.16em;color:var(--accent);font-weight:650}h1{font-size:27px;letter-spacing:-.03em;margin:6px 0}header p{color:var(--muted);margin:0;max-width:950px}.meta{font-size:12px;margin-top:8px!important}.metrics{display:flex;flex-wrap:wrap;gap:28px;padding:18px 32px}.metric strong{font-size:24px;display:block}.metric span{font-size:12px;color:var(--muted)}.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:0 32px 18px}.controls label{display:flex;gap:7px;align-items:center;font-size:12px}.controls input[type=search]{min-width:240px;width:330px}.controls input,.controls select,.controls button{border:1px solid var(--line);background:var(--surface);border-radius:7px;padding:7px 10px}.controls button:hover{color:var(--accent)}.layout{display:grid;grid-template-columns:minmax(420px,1.25fr) minmax(300px,.75fr);gap:22px;padding:0 32px 32px;align-items:start}.tree-shell{background:var(--surface);padding:18px 18px 22px;border:1px solid var(--line);border-radius:10px;min-width:0}.tree-head{display:flex;justify-content:space-between;gap:12px;color:var(--muted);font-size:12px;padding-bottom:14px}.tree-list,.children{list-style:none;margin:0;padding:0}.children{margin-left:15px;padding-left:17px;border-left:1px solid var(--line)}.node{margin:2px 0}.row{display:flex;align-items:center;gap:8px;min-height:42px;padding:5px 4px;position:relative}.leaf>.row::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}.children>.node>.row::after,.children>.node>details>summary::after{content:"";position:absolute;left:-18px;top:21px;width:15px;border-top:1px solid var(--line)}summary.row{cursor:pointer;list-style:none}summary.row::-webkit-details-marker{display:none}.chevron{display:inline-block;font-size:11px;transition:transform .15s;width:12px;flex:none}details[open]>summary .chevron{transform:rotate(90deg)}.node-title{background:transparent;border:0;text-align:left;padding:2px 0;flex:1;min-width:0;line-height:1.45}.node-title:hover{color:var(--accent)}.row.selected{background:var(--good);border-radius:5px}.badge{display:inline-block;border-radius:4px;font-size:10px;line-height:1.6;padding:2px 6px;white-space:nowrap;background:var(--excluded);flex:none}.implemented{background:var(--good)}.partial{background:var(--partial)}.planned{background:var(--plan)}.excluded{background:var(--excluded)}.enable{color:var(--muted);font-size:10px;min-width:58px;text-align:right}.detail{position:sticky;top:18px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:22px;min-width:0}.trail{font-size:11px;color:var(--muted);margin-bottom:14px;overflow-wrap:anywhere}.detail h2{font-size:20px;line-height:1.5;margin:0 0 12px}.detail h3{font-size:12px;color:var(--muted);margin:22px 0 5px}.detail p{margin:7px 0;overflow-wrap:anywhere}.detail ul{padding-left:18px}.path{display:block;margin:7px 0;font:11px/1.6 ui-monospace,SFMono-Regular,monospace;word-break:break-all;color:var(--accent);text-decoration:none}.path:hover{text-decoration:underline}.legend{display:flex;flex-wrap:wrap;gap:8px;margin-top:20px}.notice{font-size:12px;color:var(--muted);border-top:1px solid var(--line);margin-top:20px;padding-top:14px}#empty{color:var(--muted);padding:20px 0}[hidden]{display:none!important}.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0)}
@media(max-width:950px){.layout{grid-template-columns:1fr}.detail{position:static}.enable{min-width:50px}.metrics{gap:22px}}
@media(max-width:600px){header{padding:22px 16px 16px}.metrics,.controls{padding-left:16px;padding-right:16px}.layout{padding:0 12px 24px}.tree-shell{padding:12px 8px}.children{margin-left:8px;padding-left:10px}.children>.node>.row::after,.children>.node>details>summary::after{left:-11px;width:8px}.row{flex-wrap:wrap;gap:5px}.node-title{min-width:130px}.enable{min-width:auto}h1{font-size:23px}.controls input[type=search]{width:100%;min-width:0}.controls label:first-child{width:100%}.detail{padding:18px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<header><div class="eyebrow">WORKBENCH / REQUIREMENTS</div><h1 id="page-title">工作台 · 需求与实现地图</h1><p>从核心需求展开到具体能力，查看实现位置、启用条件与仍待推进的部分。</p><p class="meta" id="meta"></p></header>
<section class="metrics" aria-label="需求统计" id="metrics"></section>
<form class="controls" onsubmit="return false" aria-label="筛选需求">
<label><span class="sr-only">搜索需求、路径与说明</span><input id="search" type="search" placeholder="搜索需求、实现路径或说明…"></label>
<label>实现状态<select id="status-filter"><option value="all">全部</option><option value="implemented">已实现</option><option value="partial">部分实现</option><option value="planned">后续规划</option><option value="excluded">本版排除</option></select></label>
<label><input id="enabled-filter" type="checkbox">只看默认启用</label>
<button type="button" id="expand">全部展开</button><button type="button" id="collapse">收起子需求</button><button type="button" id="export">导出需求 JSON</button>
</form>
<main class="layout">
<section class="tree-shell" aria-label="需求树"><div class="tree-head"><span>需求 → 能力 → 实现</span><span id="visible-count" aria-live="polite"></span></div><ul id="tree" class="tree-list"></ul><div id="empty" hidden>没有匹配的需求。调整筛选条件可继续查看。</div><div class="legend"><span class="badge implemented">已实现</span><span class="badge partial">部分实现</span><span class="badge planned">后续规划</span><span class="badge excluded">本版排除</span></div></section>
<aside class="detail" id="detail" aria-label="需求详情" aria-live="polite"></aside>
</main>
<script type="application/json" id="requirements-data">__REQUIREMENTS_DATA__</script>
<script>
(()=>{
 const data=JSON.parse(document.getElementById('requirements-data').textContent);
 const labels={implemented:'已实现',partial:'部分实现',planned:'后续规划',excluded:'本版排除'};
 const enabled={default:'默认启用',conditional:'需配置',off:'默认关闭',unavailable:'未提供',mixed:'分项查看'};
 const tree=document.getElementById('tree'),detail=document.getElementById('detail'),index=new Map(),paths=new Map();
 let selected=data.tree.id,expanded=new Set();
 function catalog(node,path=[]){index.set(node.id,node);paths.set(node.id,[...path,node]);if(node.children){expanded.add(node.id);node.children.forEach(child=>catalog(child,[...path,node]));}}
 catalog(data.tree);
 document.getElementById('page-title').textContent=data.title;
 document.getElementById('meta').textContent=`设计快照 ${data.updatedAt} · ${data.baseline}`;
 const leaves=[...index.values()].filter(node=>!node.children);
 const metrics=[['叶子需求',leaves.length],['已实现',leaves.filter(node=>node.status==='implemented').length],['后续规划',leaves.filter(node=>node.status==='planned').length],['本版排除',leaves.filter(node=>node.status==='excluded').length]];
 for(const [label,value] of metrics){const entry=document.createElement('div');entry.className='metric';const number=document.createElement('strong');number.textContent=value;const caption=document.createElement('span');caption.textContent=label;entry.append(number,caption);document.getElementById('metrics').append(entry);}
 function matches(node){const query=document.getElementById('search').value.trim().toLocaleLowerCase(),status=document.getElementById('status-filter').value,only=document.getElementById('enabled-filter').checked;return (!query||JSON.stringify(node.children?{...node,children:undefined}:node).toLocaleLowerCase().includes(query))&&(status==='all'||node.status===status)&&(!only||node.enabled==='default');}
 function included(node){return matches(node)||(node.children||[]).some(included);}
 function badge(node){const span=document.createElement('span');span.className='badge '+node.status;span.textContent=labels[node.status];return span;}
 function choose(id){selected=id;renderDetail();document.querySelectorAll('.row').forEach(row=>row.classList.toggle('selected',row.dataset.id===id));}
 function row(node,branch){const container=document.createElement(branch?'summary':'div');container.className='row'+(selected===node.id?' selected':'');container.dataset.id=node.id;if(branch){const arrow=document.createElement('span');arrow.className='chevron';arrow.textContent='▸';arrow.setAttribute('aria-hidden','true');container.append(arrow);}const title=document.createElement('button');title.type='button';title.className='node-title';title.textContent=node.title;title.onclick=event=>{event.preventDefault();event.stopPropagation();choose(node.id);};container.append(title,badge(node));const state=document.createElement('span');state.className='enable';state.textContent=enabled[node.enabled];container.append(state);return container;}
 function build(node){if(!included(node))return null;const li=document.createElement('li');li.className='node'+(node.children?'':' leaf');if(node.children){const branch=document.createElement('details');branch.open=expanded.has(node.id)||document.getElementById('search').value!==''||document.getElementById('status-filter').value!=='all';branch.append(row(node,true));const children=document.createElement('ul');children.className='children';node.children.forEach(child=>{const item=build(child);if(item)children.append(item);});branch.append(children);branch.addEventListener('toggle',()=>{branch.open?expanded.add(node.id):expanded.delete(node.id);});li.append(branch);}else li.append(row(node,false));return li;}
 function render(){tree.replaceChildren();const root=build(data.tree);if(root)tree.append(root);document.getElementById('empty').hidden=!!root;document.getElementById('visible-count').textContent=`${leaves.filter(matches).length} / ${leaves.length} 项叶子需求`;}
 function section(title,text){const h=document.createElement('h3');h.textContent=title;const p=document.createElement('p');p.textContent=text;detail.append(h,p);}
 function renderDetail(){const node=index.get(selected),path=paths.get(selected);detail.replaceChildren();const trail=document.createElement('div');trail.className='trail';trail.textContent=path.map(item=>item.title).join(' / ');const title=document.createElement('h2');title.textContent=node.title;detail.append(trail,title,badge(node));section('启用情况',enabled[node.enabled]+(node.setting?' · '+node.setting:''));if(node.why)section('本质需求',node.why);if(node.acceptance)section('行为与验收边界',node.acceptance);const files=node.implementation||[];if(files.length){const h=document.createElement('h3');h.textContent='实现位置';detail.append(h);files.forEach(file=>{const link=document.createElement('a');link.className='path';link.href='../../'+file;link.textContent=file;link.target='_blank';link.rel='noopener';detail.append(link);});}else if(!node.children)section('实现位置',node.status==='excluded'?'此版本明确不提供。':'尚未落地到整合版。');if(node.children){const names=document.createElement('ul');node.children.forEach(child=>{const item=document.createElement('li');item.textContent=child.title+' · '+labels[child.status];names.append(item);});const h=document.createElement('h3');h.textContent='下一级需求';detail.append(h,names);}const notice=document.createElement('p');notice.className='notice';notice.textContent=data.enablementNote;detail.append(notice);}
 for(const id of ['search','status-filter','enabled-filter'])document.getElementById(id).addEventListener(id==='search'?'input':'change',render);
 document.getElementById('expand').onclick=()=>{index.forEach(node=>{if(node.children)expanded.add(node.id);});render();};
 document.getElementById('collapse').onclick=()=>{expanded=new Set([data.tree.id]);document.getElementById('search').value='';document.getElementById('status-filter').value='all';render();};
 document.getElementById('export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='workbench-requirements.json';link.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
 render();renderDetail();
})();
</script>
</body>
</html>
