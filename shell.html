<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工作视图实验</title><style>
:root{font:14px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#273432;background:#f9fbfa}*{box-sizing:border-box}body{margin:0}header{position:sticky;top:0;background:#f9fbfa;border-bottom:1px solid #dfe6e2;padding:12px 16px;z-index:2}header .top{display:flex;gap:8px;align-items:center}h1{font-size:15px;margin:0;flex:1;font-weight:650}button{font:inherit;font-size:12px;border:0;border-radius:4px;background:#e9efeb;color:#324d41;padding:4px 8px;cursor:pointer}button:hover{background:#dce9e0}#status{font-size:11px;color:#75857c;margin-top:5px}#status[data-kind=draft]{color:#a56b1e}main{padding:14px 18px 60px;overflow-wrap:anywhere}.empty{color:#7d8882;padding:24px 0}.row{display:grid;grid-template-columns:10px minmax(0,1fr);gap:7px;align-items:start;padding:3px 0;margin-left:calc(var(--depth)*13px)}.row[hidden]{display:none}.row.root{padding-bottom:9px;margin-bottom:4px;border-bottom:1px solid #edf0ee}.row.root .body{font-weight:600;font-size:16px}.dot{color:#96a69a;cursor:pointer;font-size:15px;line-height:1.5}.body p{margin:0}.body :is(h1,h2,h3,h4){font-size:15px;margin:5px 0}.body ul,.body ol{margin:3px 0;padding-left:21px}.body blockquote{border-left:2px solid #b5c8b9;margin:5px 0;padding-left:9px;color:#66766c}.body pre{overflow:auto;padding:9px;background:#edf1ee;border-radius:4px;font-size:12px;font-weight:400}.body code{background:#edf1ee;padding:1px 3px;font-size:12px}.body table{border-collapse:collapse;font-size:12px}.body th,.body td{border:1px solid #dbe3dd;padding:3px 7px}.body a{color:#487a60;text-decoration:none}.body img{max-width:100%}.label{color:#74867a;font-size:11px;font-weight:500;margin-right:6px;white-space:nowrap}.task{font-size:10px;color:#a96a2b;font-weight:650;margin-right:7px}.row.draft{background:linear-gradient(90deg,#fff4d555,transparent)}footer{position:fixed;bottom:0;width:100%;padding:6px 16px;background:#f9fbfaf2;color:#89958d;font-size:10px;border-top:1px solid #e6ebe8}.error{color:#a43f37}#external{display:none}
.row{grid-template-columns:16px 14px minmax(0,1fr) 24px;gap:4px;padding:5px 0;margin-left:calc(var(--depth)*18px);border-radius:3px}.handle,.dot,.go{padding:0;background:transparent;color:#81988c;line-height:22px}.handle{cursor:grab;opacity:.5;touch-action:none;user-select:none}.handle:disabled{visibility:hidden}.dot:disabled{cursor:default}.go{opacity:.4}.row:hover .go,.row:hover .handle{opacity:1}.source-focus{box-shadow:inset 3px 0 #278365;background:#e7f4ee}.selected{outline:1px solid #bfd3c7;outline-offset:1px}.row:focus{outline:2px solid #75a890}.missing{color:#97766a;font-style:italic}.outside .go{color:#b87534}.dragging{opacity:.4}.drop-before{border-top:2px solid #278365}.drop-after{border-bottom:2px solid #278365}.drop-child{background:#d7ebe0;box-shadow:inset 20px 0 #c1dece}#focus{margin-top:6px;font-size:10px}header{padding:10px 14px}main{padding:12px 12px 60px}.body{user-select:text}.body .label{font-size:11px}footer{z-index:2}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin:0 0 9px;padding-bottom:7px;border-bottom:1px dashed #e3eae5}
#crumbs[hidden]{display:none}
.crumb{font:inherit;font-size:11px;background:transparent;color:#4f7a63;padding:1px 4px;border-radius:3px;cursor:pointer;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.crumb:hover{background:#e4efe8;color:#26543c}
.crumb.current{color:#273432;font-weight:600;cursor:default;background:#eef4f0}
.crumb-sep{color:#a8b6ad;font-size:11px}
/* 对象类型样式：任务 / MiniProject / 事务 是可聚焦对象，其余标记为上下文行 */
.row[data-role=miniproject] .label{background:#e6e1fb;color:#4a3a92;font-weight:600}
.row[data-role=miniproject] .body{font-weight:600}
.row[data-role=miniproject]{box-shadow:inset 2px 0 #b9aaf0;background:#f7f5ff;border-radius:3px}
.row[data-role=affair] .label{background:#fde8dd;color:#96431b}
.row[data-role=affair]{box-shadow:inset 2px 0 #f0b795;background:#fffaf7;border-radius:3px}
.row[data-role=task] .label{background:#e2f0ff;color:#1d5b9e}
.enter-object{grid-column:3;justify-self:start;font-size:10px;padding:1px 5px}.enter-object[hidden]{display:none}.scope-hint{font-size:10px;color:#85672e;margin-left:auto}#crumbs{margin:7px 0 0;padding:5px 0 0;border-bottom:0;border-top:1px dashed #dfe6e2}</style></head><body><header><div class="top"><h1>工作视图实验</h1><button id="locate">原文</button><button id="external">独立窗口</button><button id="close">关闭</button></div><button id="focus" hidden>定位正在编辑的条目</button><div id="status">普通点击聚焦工作对象 · 右键可显式打开任意块</div></header><main id="rows"><nav id="crumbs" hidden></nav><div class="empty">选定的块与子块将在这里显示。<br>编辑中的内容也会更新。</div></main><footer id="foot">拖动组织 · Tab 缩进 · 正文在 Logseq 编辑</footer><!-- scripts --></body></html>
