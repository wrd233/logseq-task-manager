<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>工作视图</title><style>
:root{font:13px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;color:#303d35;background:#eef1ed;--line:#e3e8e1;--muted:#7c897f}*{box-sizing:border-box}body{margin:0}button{font:inherit;font-size:11px;color:#526657;border:0;background:transparent;border-radius:3px;cursor:pointer;padding:3px 6px}button:hover{background:#e7ede4;color:#2d4834}button:focus-visible{outline:2px solid #85a28a;outline-offset:1px}[hidden]{display:none!important}
header{position:sticky;top:0;padding:8px 13px 7px;background:#eef1edf5;border-bottom:1px solid #dfe5db;z-index:3}header .top{display:flex;align-items:center;gap:5px}h1{font-size:12px;font-weight:600;margin:0;flex:1}#status{font-size:10px;color:var(--muted);margin-top:2px}#status[data-kind=draft]{color:#98733f}#focus{font-size:10px;padding:1px 0;margin-top:3px;color:#52765a}#external{display:none}
main{margin:11px 10px 32px;padding:14px 12px 19px;background:#fff;border:1px solid #dfe5db;border-radius:7px;overflow-wrap:anywhere;box-shadow:0 1px 3px #2b402107}.empty{color:var(--muted);padding:22px 0}
.row{display:grid;grid-template-columns:10px 10px minmax(0,1fr) 15px;gap:3px;align-items:start;padding:3px 0;margin-left:calc(min(var(--depth),4)*8px);border-radius:2px;scroll-margin-top:100px}.row.root{margin:0 0 7px;padding:0 0 10px;border-bottom:1px solid var(--line);grid-template-columns:0 0 minmax(0,1fr) 15px;gap:0}.root .body{font-size:18px;line-height:1.45;font-weight:650;letter-spacing:-.025em}.root .label{display:block;margin:0 0 5px;padding:0;background:none;color:#88937e;font-size:10px;line-height:1.2;letter-spacing:.04em;font-weight:500}.root .dot{display:none}
.handle{grid-column:1}.dot{grid-column:2}.go{grid-column:4}.body{grid-column:3;min-width:0;user-select:text}.body p{margin:0}.body p+p{margin-top:4px}.body strong{font-weight:600}.body :is(h1,h2,h3,h4){font-size:14px;line-height:1.5;margin:4px 0}.body ul,.body ol{margin:2px 0;padding-left:18px}.body blockquote{border-left:2px solid #c0cebf;margin:4px 0;padding-left:8px;color:#61715f}.body pre{white-space:pre-wrap;overflow-wrap:anywhere;overflow:auto;padding:8px;background:#f4f6f1;margin:4px 0;border-radius:3px;font:11px/1.55 ui-monospace,monospace}.body code{background:#f3f5ef;font-size:11px}.body table{border-collapse:collapse;font-size:11px}.body td,.body th{border:1px solid var(--line);padding:3px 5px}.body a{color:#496e51;text-decoration:underline;text-underline-offset:2px}
.label{font-size:10px;font-weight:500;color:#7c8978;white-space:nowrap;margin-right:5px}.task{display:inline-block;vertical-align:1px;font-size:9px;line-height:15px;font-weight:650;color:#637640;background:#eff3e6;border-radius:2px;padding:0 4px;margin-right:5px}.row[data-role=action] .body{font-weight:550;color:#314431}.row[data-role=note] .body{color:#63715f}.row[data-role=idea] .body{color:#697561}
.handle,.dot,.go{padding:0;background:transparent;color:#96a48f;line-height:20px;min-width:0}.handle{cursor:grab;opacity:0;touch-action:none;user-select:none;font-size:11px}.handle:disabled{visibility:hidden}.dot{font-size:12px}.dot:disabled{opacity:.4;cursor:default}.go{opacity:.25;font-size:12px}.row:hover .handle,.row:focus-within .handle{opacity:.7}.row:hover .go,.row:focus-within .go{opacity:1}.enter-object{grid-column:3;justify-self:start;padding:0 4px;margin:0;font-size:10px;background:#f0f4ec;line-height:17px}
.source-focus{box-shadow:inset 2px 0 #6c946d;background:#f0f6ed}.selected{outline:1px solid #ccd9c4;outline-offset:1px}.row:focus-visible{outline:2px solid #87a581}.missing{color:#9b786a;font-style:italic}.outside .go{color:#a57b42}.dragging{opacity:.4}.drop-before{box-shadow:inset 0 2px #6c946d}.drop-after{box-shadow:inset 0 -2px #6c946d}.drop-child{background:#e8f1e3;box-shadow:inset 12px 0 #d2e3c8}
#crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:3px;margin-top:5px;padding-top:4px;border-top:1px solid #dfe5db}.crumb{font-size:10px;max-width:175px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;padding:0 3px}.crumb.current{font-weight:600;color:#4d624d}.crumb-sep{color:#aab7a1;font-size:10px}.scope-hint{font-size:10px;color:#88734e;margin-left:auto}
footer{position:fixed;bottom:0;width:100%;padding:4px 13px;font-size:9px;color:#8a9684;background:#eef1edf2;border-top:1px solid #dfe5db;z-index:3}
@media(min-width:650px){main{max-width:850px;margin:14px auto 40px;padding:20px 24px}.row{padding-top:4px;padding-bottom:4px}}
.row[data-display=emphasis]>.body{font-weight:600;color:#243f2e}.row[data-display=quiet]>.body{color:#758071;font-size:12px}.body-compressed{display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;max-height:4.65em}.expand-body{grid-column:3;justify-self:start;padding:1px 0;font-size:10px;color:#53735b}.display-controls{grid-column:3;display:flex;gap:7px;justify-self:end;height:0;overflow:hidden;opacity:0}.row:hover>.display-controls,.row:focus-within>.display-controls{height:auto;opacity:1;overflow:visible}.display-controls select{font:inherit;font-size:10px;color:#61715f;background:#f4f6f2;border:1px solid #dde4d9;border-radius:3px}.display-controls button{font-size:10px;padding:0}.raw-body{grid-column:3;margin:3px 0;padding:8px;white-space:pre-wrap;overflow-wrap:anywhere;background:#f4f6f2;font:11px/1.6 ui-monospace,monospace;user-select:text}.row[data-display=compact]>.body{color:#63715f}
</style></head><body><header><div class="top"><h1>工作视图</h1><button id="locate">原文</button><button id="external">独立窗口</button><button id="close">关闭</button></div><div id="status">等待选择内容</div><button id="focus" hidden>定位正在编辑的条目</button></header><main id="rows"><div class="empty">点击 Logseq 中的内容以聚焦工作对象。</div></main><footer id="foot">拖动排列 · Tab 调整层级 · 正文在 Logseq 编辑</footer><!-- scripts --></body></html>
